name: Recast
configs:
  Debug: debug
  Release: release
  Direct: release
options:
  bundleIdPrefix: com.lukemclaughlin
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "123"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 24UCS53598
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Recast:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
        excludes:
          - "**/* 2.swift"
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.recast
        PRODUCT_NAME: Recast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Recast
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Luke McLaughlin. All rights reserved."
        # Mac App Store build: sandboxed and limited to native conversion engines.
        INFOPLIST_KEY_LSUIElement[sdk=macosx*]: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/Recast-macOS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx*]: "$(inherited) APP_STORE"
        # iOS / iPadOS window + file handling
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Direct:
          PRODUCT_BUNDLE_IDENTIFIER: com.lukemclaughlin.recast.direct
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  Recast:
    build:
      targets:
        Recast: all
    run:
      config: Debug
      storeKitConfiguration: Recast.storekit
    archive:
      config: Release
